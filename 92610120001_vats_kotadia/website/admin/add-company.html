<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Vats Kotadia">
  <meta name="enrolment" content="92610120001">
  <title>Add company — Falcon Crest console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">

    <nav class="side" aria-label="Console">
      <div class="side__brand"><a class="wordmark" href="../index.html">Falcon Crest</a></div>
      <div class="side__nav">
        <a href="index.html" aria-current="page">Portfolio</a>
        <a href="lp-reporting.html">LP reporting</a>
        <a href="allocation.html">Fund &amp; allocation</a>
        <a href="analytics.html">Analytics</a>
        <a href="team.html">Team &amp; access</a>
      </div>
      <div class="side__user">
        <img class="avatar" src="../images/team-reyes.webp" width="320" height="320" alt="">
        <span>M. Reyes · GP</span>
      </div>
    </nav>

    <div class="main" id="main">

      <div class="topbar">
        <div class="topbar__lead">
          <button class="btn btn--secondary side-toggle" type="button" aria-expanded="false">Menu</button>
          <div>
            <h1>Add company</h1>
            <span class="eyebrow topbar__context">Portfolio · new record</span>
          </div>
        </div>
        <div class="topbar__actions">
          <a class="btn btn--secondary" href="index.html">Cancel</a>
        </div>
      </div>

      <div class="workspace__main form-column">

        <!-- ============ VALIDATED FORM 3 ============ -->
        <form id="company-form" data-validate novalidate
              data-success="Company added to the Fund IV portfolio. It will appear in the table shortly.">

          <div class="form-status" role="status"></div>

          <section class="panel panel--stacked">
            <h2 class="h2">Company</h2>

            <div class="form-grid">
              <div class="field">
                <label for="co-name">Company name</label>
                <input type="text" id="co-name" name="name" placeholder="Harborline"
                       data-rule-required="Enter the company name."
                       data-rule-min="2|A company name needs at least two characters.">
                <span class="field__error"></span>
              </div>

              <div class="field">
                <label for="co-site">Website</label>
                <input type="url" id="co-site" name="website" placeholder="https://company.com"
                       data-rule-required="Enter the company website."
                       data-rule-pattern="^https?:\/\/[^\s.]+\.[^\s]{2,}$|Include the full address, starting with http:// or https://">
                <span class="field__error"></span>
              </div>
            </div>

            <div class="field">
              <label for="co-desc">One-line description</label>
              <textarea id="co-desc" name="description" class="textarea--short"
                        placeholder="Port-side customs clearing built as an API."
                        data-rule-required="Add a one-line description for the portfolio page."
                        data-rule-max="140|Keep this under 140 characters."></textarea>
              <span class="char-count" data-for="co-desc" data-limit="140">0 / 140</span>
              <span class="field__error"></span>
            </div>
          </section>

          <section class="panel panel--stacked">
            <h2 class="h2">Investment</h2>

            <div class="form-grid">
              <div class="field">
                <label for="co-sector">Sector</label>
                <select id="co-sector" name="sector" data-rule-required="Choose a sector.">
                  <option value="">Select sector</option>
                  <option value="ai">Compute &amp; AI</option>
                  <option value="defence">Defence &amp; space</option>
                  <option value="fintech">Fintech</option>
                  <option value="commerce">Commerce</option>
                  <option value="work">Work</option>
                </select>
                <span class="field__error"></span>
              </div>

              <div class="field">
                <label for="co-fund">Fund</label>
                <select id="co-fund" name="fund" data-rule-required="Choose which fund this comes from.">
                  <option value="">Select fund</option>
                  <option value="iii">Fund III</option>
                  <option value="iv">Fund IV</option>
                  <option value="v">Fund V</option>
                </select>
                <span class="field__error"></span>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <label for="co-cheque">First cheque (US$ millions)</label>
                <input type="number" id="co-cheque" name="cheque" placeholder="4.5" step="0.1"
                       data-rule-required="Enter the cheque size."
                       data-rule-number="1,8|Fund IV first cheques run from $1M to $8M.">
                <span class="field__hint">Between 1 and 8, matching the stated thesis.</span>
                <span class="field__error"></span>
              </div>

              <div class="field">
                <label for="co-ownership">Ownership (%)</label>
                <input type="number" id="co-ownership" name="ownership" placeholder="8.5" step="0.1"
                       data-rule-required="Enter the ownership percentage."
                       data-rule-number="0.1,100|Ownership must be between 0.1% and 100%.">
                <span class="field__error"></span>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <label for="co-date">First cheque date</label>
                <input type="text" id="co-date" name="date" placeholder="2026-09"
                       data-rule-required="Enter the month of the first cheque."
                       data-rule-pattern="^(19|20)[0-9]{2}-(0[1-9]|1[0-2])$|Use the format YYYY-MM, for example 2026-09.">
                <span class="field__error"></span>
              </div>

              <div class="field">
                <label for="co-lead">Deal lead email</label>
                <input type="email" id="co-lead" name="lead" placeholder="p.nair@falconcrest.vc"
                       data-rule-required="Name the partner leading this deal."
                       data-rule-email="That address doesn't look right — check for a missing @ or domain."
                       data-rule-pattern="@falconcrest\.vc$|The deal lead must be a Falcon Crest address.">
                <span class="field__error"></span>
              </div>
            </div>

            <div class="field">
              <label class="checkbox-inline consent-label">
                <input type="checkbox" id="co-signed" name="signed"
                       data-rule-checked="Confirm the term sheet is signed before adding the record.">
                Term sheet is signed and countersigned.
              </label>
              <span class="field__error"></span>
            </div>
          </section>

          <div class="submit-row">
            <button class="btn btn--primary" type="submit">Add company</button>
            <a class="btn btn--secondary" href="index.html">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/validation.js"></script>
</body>
</html>
